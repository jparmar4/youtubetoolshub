# CI: typecheck + lint + tests + production build on every push/PR.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Build-time stubs so prerender never sees undefined critical env.
      MYSQL_HOST: ci-placeholder
      MYSQL_USER: ci-placeholder
      MYSQL_PASSWORD: ci-placeholder
      MYSQL_DATABASE: ci-placeholder
      AUTH_SECRET: ci-build-only-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
